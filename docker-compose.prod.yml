# Producción: VPS Ancous (web.ancous.tech)
# - Usa el Postgres compartido de Policrafters (servicio "db", BD wagtail_db)
# - Traefik en la red n8n_default
# - Astro (policrafters_astro) atiende el resto de rutas de web.ancous.tech

services:
  policrafters_cms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: policrafters_cms
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DJANGO_SETTINGS_MODULE: policrafters_cms.settings.production
      PORT: 8000
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn policrafters_cms.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    volumes:
      - static_data:/app/static
      - media_data:/app/media
      # Pendiente: rebuild de Astro al publicar (cuando PUBLIC_USE_API=true)
      # - /var/lib/policrafters/deploy-trigger:/deploy-trigger
    networks:
      - policrafters_policrafters_network   # Postgres compartido (host: db)
      - n8n_default                         # Traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.policrafters-cms.rule=Host(`web.ancous.tech`) && (PathPrefix(`/admin`) || PathPrefix(`/django-admin`) || PathPrefix(`/api`) || PathPrefix(`/documents`) || PathPrefix(`/search`))"
      - "traefik.http.routers.policrafters-cms.entrypoints=web,websecure"
      - "traefik.http.routers.policrafters-cms.tls=true"
      - "traefik.http.routers.policrafters-cms.tls.certresolver=mytlschallenge"
      - "traefik.http.services.policrafters-cms.loadbalancer.server.port=8000"

  policrafters_cms_assets:
    image: nginx:alpine
    container_name: policrafters_cms_assets
    restart: unless-stopped
    volumes:
      - static_data:/usr/share/nginx/html/static:ro
      - media_data:/usr/share/nginx/html/media:ro
    networks:
      - n8n_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.policrafters-cms-assets.rule=Host(`web.ancous.tech`) && (PathPrefix(`/static`) || PathPrefix(`/media`))"
      - "traefik.http.routers.policrafters-cms-assets.entrypoints=web,websecure"
      - "traefik.http.routers.policrafters-cms-assets.tls=true"
      - "traefik.http.routers.policrafters-cms-assets.tls.certresolver=mytlschallenge"
      - "traefik.http.services.policrafters-cms-assets.loadbalancer.server.port=80"

volumes:
  static_data:
  media_data:

networks:
  policrafters_policrafters_network:
    external: true
  n8n_default:
    external: true