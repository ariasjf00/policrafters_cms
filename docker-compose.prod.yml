services:
  db:
    image: postgres:16
    container_name: policrafters_cms_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - policrafters_cms_postgres_data:/var/lib/postgresql/data

    # Solo para administración desde el VPS o mediante túnel SSH.
    # PostgreSQL NO queda publicado hacia Internet.
    ports:
      - "127.0.0.1:5434:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - policrafters_cms_network

  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: policrafters_cms
    restart: unless-stopped

    env_file:
      - .env.production

    environment:
      DJANGO_SETTINGS_MODULE: policrafters_cms.settings.production
      PORT: 8000

    command: >
      sh -c "python manage.py migrate --noinput &&
            python manage.py collectstatic --noinput &&
            gunicorn policrafters_cms.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"  
    
    depends_on:
      db:
        condition: service_healthy

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - static_data:/app/static
      - media_data:/app/media

    networks:
      - policrafters_cms_network

volumes:
  policrafters_cms_postgres_data:
  static_data:
  media_data:

networks:
  policrafters_cms_network:
    driver: bridge